name: windows

# The kit is one Python implementation, but Windows is where paths, the
# launcher (.cmd + .ps1) and the file locks behave differently. This runs the
# same three suites a POSIX runner runs, on a real Windows machine, under the
# Python the bootstrap would install.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit
        shell: pwsh
        run: python -m unittest discover -s tests/unit -t .
      - name: contract
        shell: pwsh
        run: python -m unittest discover -s tests/contract -t .
      - name: e2e
        shell: pwsh
        run: python -m unittest discover -s tests/e2e -t .
      - name: the bootstrap and the launcher parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in @("bootstrap\ensure-python.ps1", "bootstrap\exakit.ps1", "install.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { Write-Host "$file does not parse under 5.1"; $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host "ok $file"
          }
