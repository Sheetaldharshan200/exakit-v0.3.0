name: real install

# The manual acceptance rows M-3 and M-5 of docs/test-and-acceptance.md, run on
# a scratch machine nobody keeps: a fresh runner. The install goes through the
# public path (install.sh, the kit's own Python, `python -m exakit install`)
# with a persona, then the commands an agent runs, then a re-run, then the
# full uninstall. Nothing here is mocked; the runner is thrown away after.
#
# ubuntu-latest is the machine that proves the database: Podman is there and
# the deployment runs. macos-latest is a VM itself and Apple's Virtualization
# framework is not available inside it, so the launcher cannot deploy the
# database there; that job proves everything around it (the bootstrap, the
# launcher download, the persona's add-ons and skills, status with no
# database, the uninstall) and is allowed to fail at "status must be running".
# windows-latest is the same story under Windows PowerShell 5.1: the hosted
# runner has no WSL2 and no nested virtualisation, so install.ps1, the
# bootstrap, the kit's Python, the persona, the skills, status and the
# uninstall are proven there and the database is not (that is M-5, a real
# Windows 11 machine or a self-hosted runner).
on:
  workflow_dispatch:

jobs:
  install:
    name: full install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      EXAKIT_LOCAL_KIT: ${{ github.workspace }}
      EXAKIT_KIT_REPO: ${{ github.repository }}
      EXAKIT_PERSONA: analyst
      EXAKIT_NO_UPDATE_NOTICE: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: the machine
        run: |
          uname -a
          if command -v free >/dev/null 2>&1; then free -g; else sysctl -n hw.memsize; fi
          df -h "$HOME" | tail -1
          command -v podman >/dev/null 2>&1 && podman --version || echo "no podman (macOS: the launcher brings its own VM)"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"

      - name: make room (the Linux runner ships with 14 GB free; the kit asks for 20)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h "$HOME" | tail -1

      - name: preflight (installs nothing)
        run: EXAKIT_PREFLIGHT=1 sh install.sh

      - name: dry run (installs nothing)
        run: |
          EXAKIT_DRY_RUN=1 sh install.sh
          test ! -f "$HOME/.exasol-starter-kit/manifest.json"

      - name: install with the analyst persona
        run: |
          start=$(date +%s)
          sh install.sh
          echo "install took $(( $(date +%s) - start ))s"

      - name: status must be running
        run: |
          for i in $(seq 1 60); do
            if exakit status --json > status.json; then break; fi
            sleep 10
          done
          cat status.json
          python3 -c 'import json; d=json.load(open("status.json")); assert d["running"] and d["status"]=="running", d["status"]; assert "tpch" in d["datasets_loaded"], d["datasets_loaded"]; print("persona:", d["persona"])'

      - name: the commands an agent runs
        run: |
          set -e
          exakit version --json | tee version.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print({r["component"]: r["status"] for r in d["components"]})'
          exakit info --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("info:", d["status"], d["runtime"]["dsn"])'
          exakit sql --json "SELECT COUNT(*) AS n FROM TPCH.NATION" | tee sql.json
          python3 -c 'import json; d=json.load(open("sql.json")); assert d["ok"] and int(list(d["rows"][0].values())[0]) == 25, d'
          exakit sql --json "DELETE FROM TPCH.NATION" > reject.json || true
          python3 -c 'import json; d=json.load(open("reject.json")); assert d["ok"] is False and d.get("rejected"), d'
          exakit marketplace --list --json | tee marketplace.json
          exakit persona plan analyst --json | tee plan.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("plan:", d["status"], "pending", d["pending"])'
          exakit skills --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("skills:", d["status"], len(d["skills"]))'
          exakit logs --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("logs:", [t["target"] for t in d["targets"]])'
          exakit mcp-status --json > mcp.json || true; head -c 400 mcp.json; echo
          exakit catalog --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("catalog:", d["count"], "commands")'
          exakit help mcp >/dev/null && exakit guide >/dev/null

      - name: a second run skips every done step
        run: |
          start=$(date +%s)
          sh install.sh | tee rerun.log
          echo "re-run took $(( $(date +%s) - start ))s"
          grep -c "already done, skipping" rerun.log

      - name: stop, start, update, data-load --force
        run: |
          set -e
          exakit stop
          exakit status --json > stopped.json || true
          python3 -c 'import json; d=json.load(open("stopped.json")); assert not d["running"], d["status"]; print("stopped:", d["status"], d["remedy"])'
          exakit start
          exakit status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["running"], d["status"]'
          exakit update --yes
          exakit data-load --force
          exakit status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print("datasets:", d["datasets_loaded"], d["datasets_source"])'

      - name: keep the logs
        if: always()
        run: |
          mkdir -p kept && cp -R "$HOME/.exasol-starter-kit/logs" kept/ 2>/dev/null || true
          cp -f "$HOME/.exasol-starter-kit/manifest.json" kept/ 2>/dev/null || true
          cp -f status.json version.json marketplace.json plan.json rerun.log kept/ 2>/dev/null || true

      - name: uninstall everything
        if: always()
        run: |
          exakit uninstall --dry-run || true
          exakit uninstall --yes || true
          test ! -d "$HOME/.exasol-starter-kit" && echo "kit home gone"
          test ! -e "$HOME/.local/bin/exakit" && echo "exakit command gone"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-install-${{ matrix.os }}
          path: kept/
          if-no-files-found: ignore

  install-windows:
    name: full install (windows-latest, PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: powershell
    env:
      EXAKIT_LOCAL_KIT: ${{ github.workspace }}
      EXAKIT_KIT_REPO: ${{ github.repository }}
      EXAKIT_PERSONA: analyst
      EXAKIT_NO_UPDATE_NOTICE: "1"
      NO_COLOR: "1"
      # The hosted Windows runner has 7 GB; the requirement (8) guards the
      # database, which cannot deploy here anyway. The documented hatch lets
      # the rest of the install be proven.
      EXAKIT_FORCE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: the machine
        run: |
          $PSVersionTable.PSVersion
          (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          Get-PSDrive C | Select-Object Used, Free
          try { wsl --status } catch { Write-Host "no WSL on this runner: the database cannot deploy here" }
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: preflight (installs nothing; expected to name the missing WSL)
        run: |
          $env:EXAKIT_PREFLIGHT = "1"
          Get-Content install.ps1 -Raw | Invoke-Expression
          Write-Host "preflight exit $LASTEXITCODE"
          exit 0

      - name: dry run (installs nothing)
        run: |
          $env:EXAKIT_DRY_RUN = "1"
          Get-Content install.ps1 -Raw | Invoke-Expression
          if (Test-Path "$env:USERPROFILE\.exasol-starter-kit\manifest.json") { throw "a dry run wrote the install record" }
          exit 0

      - name: install with the analyst persona
        run: |
          $start = Get-Date
          Get-Content install.ps1 -Raw | Invoke-Expression
          Write-Host "install exit $LASTEXITCODE after $([int]((Get-Date) - $start).TotalSeconds)s"
          exit 0

      - name: status, and the commands an agent runs
        run: |
          exakit status --json | Out-File status.json -Encoding utf8
          $status = Get-Content status.json -Raw | ConvertFrom-Json
          Write-Host "status: $($status.status)  persona: $($status.persona)  installed: $($status.installed)"
          if (-not $status.installed) { throw "not installed" }
          if ($status.persona -ne "analyst") { throw "the persona was not recorded" }
          exakit version --json | Out-File version.json -Encoding utf8
          exakit persona plan analyst --json | Out-File plan.json -Encoding utf8
          exakit skills --json | Out-Null
          exakit catalog --json | Out-Null
          exakit help mcp | Out-Null
          exakit info --json | Out-Null
          Write-Host "agent commands answered"

      - name: a second run skips every done step
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression 2>&1 | Tee-Object -FilePath rerun.log
          Write-Host "skipped: $((Select-String -Path rerun.log -Pattern 'already done, skipping').Count)"
          exit 0

      - name: keep the logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force kept | Out-Null
          Copy-Item -Recurse -Force "$env:USERPROFILE\.exasol-starter-kit\logs" kept\ -ErrorAction SilentlyContinue
          Copy-Item -Force "$env:USERPROFILE\.exasol-starter-kit\manifest.json" kept\ -ErrorAction SilentlyContinue
          Copy-Item -Force status.json, version.json, plan.json, rerun.log kept\ -ErrorAction SilentlyContinue
          exit 0

      - name: uninstall everything
        if: always()
        run: |
          exakit uninstall --dry-run
          exakit uninstall --yes
          if (Test-Path "$env:USERPROFILE\.exasol-starter-kit") { Write-Host "kit home still there (the managed Python folder is the known leftover, tasks.md D5)" } else { Write-Host "kit home gone" }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-install-windows-latest
          path: kept/
          if-no-files-found: ignore
